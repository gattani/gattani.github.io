summary: |
  My career began two decades ago building data pipelines for British Telecom in India. Since then, my journey has spanned across Mumbai, Cardiff London, Oslo, California, and Toronto. Along the way, I have architected enterprise data and cloud platforms, driven multi-million dollar engagements across Europe and the Nordics, and led national security analytics and Gen AI initiatives for AWS before joining Google Cloud. Today, I partner with enterprise customers to cut through the complexity and build data and AI platforms that deliver measurable business impact. My expertise sits at the intersection of cloud transformation, advanced analytics, and generative AI—tackling challenges that require both deep technical conviction and the ability to build trust at the executive level.
